# Заливка новой версии на Nexus Mods без браузера.
#
# Что умеет официальный способ Nexus (Upload API + их же действие
# Nexus-Mods/upload-action): добавить НОВУЮ ВЕРСИЮ к УЖЕ СУЩЕСТВУЮЩЕМУ файлу
# на странице мода. Создать саму страницу и первый файл через него нельзя —
# это делается один раз руками в браузере.
#
# ⚠ Предел Nexus — 20 ГБ на файл (старая новость про 1 ГБ давно неверна),
# поэтому архив уезжает ОДНИМ куском, резать не нужно.
#
# ЧТО НУЖНО ОДИН РАЗ:
#   1. Создать страницу мода и залить архив вручную (сделано: мод 4359).
#   2. На вкладке Files нажать «API Info» у файла и выписать его номер.
#   3. Settings -> Secrets and variables -> Actions:
#        секрет     NEXUS_API_KEY   — ключ из настроек аккаунта Nexus;
#        переменные NEXUS_FILE_ID   — номер файла;
#                   NEXUS_MOD_ID    — номер мода (4359), нужен для changelog.
#   Ключ хранится у GitHub и в переписку не попадает.
#
# ДАЛЬШЕ: Actions -> «Залить версию на Nexus» -> Run workflow. Архив берётся из
# релиза этого же репозитория, поэтому сначала выложи его сюда.

name: Залить версию на Nexus

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 1.1.0'
        required: true
      release_tag:
        description: 'Метка релиза этого репозитория, откуда брать архив'
        required: true
      changelog:
        description: 'Что изменилось (необязательно)'
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Взять архив из релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}"             --repo "${{ github.repository }}"             --pattern 'GAGARIN_NMS_*.zip' --clobber
          ls -lh GAGARIN_NMS_*.zip

      - name: Залить на Nexus
        uses: Nexus-Mods/upload-action@v1
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: GAGARIN_NMS_v${{ inputs.version }}.zip
          version: ${{ inputs.version }}
          display_name: GAGARIN NMS V${{ inputs.version }}
          description: 'Standalone app, unpack anywhere and run GAGARIN NMS.exe'
          update_mod_version: true
          archive_existing_version: true
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          changelog: ${{ inputs.changelog }}
